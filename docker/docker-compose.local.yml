services:
  db:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "swyp"
    restart: always
    networks:
      - app-tier

  app:
    image: app5swyp6team/swyp-app-backend:latest
    container_name: swyp-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/swyp
    depends_on:
      db:
        condition: service_started
    restart: always
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge
